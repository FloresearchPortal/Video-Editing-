<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; font-weight: 200 800; src: url("assets/brand/fonts/Manrope-Variable.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/brand/fonts/Inter-Variable.ttf"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("assets/brand/fonts/IBMPlexMono-SemiBold.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F3F8EF; }
      #root { position: relative; width: 100%; height: 100%; }
      #frame { position: absolute; inset: 0; overflow: hidden; background: #F3F8EF; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      .icon svg, .who svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .words .wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.08em; margin-bottom: -0.08em; }
      .words .w { display: inline-block; }
      .slab { display: inline-block; white-space: nowrap; }
      .slab .slab-bg { position: absolute; inset: 0 -26px; border-radius: 10px; transform-origin: 0% 50%; }
      .slab .slab-t { position: relative; font-family: "Manrope"; font-weight: 800; letter-spacing: -0.01em; line-height: 1.45; padding: 0 6px; }
      .slab.center { text-align: center; }
      .slab.center .slab-bg { left: 50%; right: auto; width: var(--w, 600px); margin-left: calc(var(--w, 600px) / -2); }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
      .card { background: #fff; border: 7px solid #0B0F14; border-radius: 34px; }
      .chip { background: #fff; border: 6px solid #0B0F14; border-radius: 999px; font: 800 44px/1 Manrope; color: #0B0F14; padding: 18px 30px; white-space: nowrap; }
      .meter .m-lab { position: absolute; left: 0; top: 0; font: 800 40px/1 Manrope; color: #0B0F14; letter-spacing: 0.04em; }
      .meter .m-track { position: absolute; left: 0; right: 110px; top: 58px; height: 48px; border: 6px solid #0B0F14; border-radius: 26px; background: #fff; overflow: hidden; }
      .meter .m-fill { position: absolute; inset: 0; transform-origin: 0% 50%; }
      .meter .m-arrow { position: absolute; right: 0; top: 34px; width: 96px; height: 96px; }
      #caps { position: absolute; left: 70px; width: 940px; top: 1408px; height: 120px; z-index: 40; }
      .cap { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 700 50px/1.2 Manrope; color: #0B0F14; }
      .cap span { background: #fff; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 6px 16px; border-radius: 14px; box-shadow: 0 6px 0 rgba(11, 15, 20, 0.08); }
      .cap b { color: #1F7A00; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="114" data-width="1080" data-height="1920">
      <div id="frame" class="clip" data-start="0" data-duration="114" data-track-index="0" data-layout-allow-overflow data-layout-allow-occlusion>
        <div id="stage"></div>
        <div id="caps"></div>
      </div>
    </div>
    <script src="avatars.js"></script>
    <script src="cast.js"></script>
    <script src="captions.js"></script>
    <script src="kit.js"></script>
    <script src="scenes.js"></script>
    <script>
      window.__timelines["main"] = K.tl;
    </script>
  </body>
</html>
