<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; font-weight: 200 800; src: url("assets/brand/fonts/Manrope-Variable.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/brand/fonts/Inter-Variable.ttf"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("assets/brand/fonts/IBMPlexMono-SemiBold.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F3F8EF; }
      #root { position: relative; width: 100%; height: 100%; }
      #frame { position: absolute; inset: 0; overflow: hidden; background: #F7F8F7; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .abs { position: absolute; }
      .icon svg, .who svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .kin .kw { display: inline-block; white-space: nowrap; }
      .kin .kc { display: inline-block; }
      .roller .rc { display: inline-block; height: 1.2em; overflow: hidden; vertical-align: top; }
      .roller .rs { display: block; line-height: 1.2em; }
      .mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
      .chip { background: #fff; border: 4px solid #38D100; border-radius: 999px; font: 800 42px/1 Manrope; color: #0B0F14; box-shadow: 0 10px 24px rgba(20,40,20,.12); padding: 16px 28px; white-space: nowrap; }
      .tag { border-radius: 14px; padding: 6px 16px; font: 800 36px Manrope; border: 4px solid #0B0F14; white-space: nowrap; }
      #caps { position: absolute; left: 60px; width: 960px; top: 1412px; height: 120px; z-index: 80; }
      .cap { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 700 46px/1.25 Manrope; color: #0B0F14; }
      .cap span { background: #fff; box-shadow: 0 8px 20px rgba(20,40,20,.12); box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 6px 18px; border-radius: 14px; }
      .cap b { color: #1E9600; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="frame" class="clip" data-start="0" data-duration="6" data-track-index="0" data-layout-allow-overflow data-layout-allow-occlusion>
        <div id="stage"></div>
      </div>
    </div>
    <script src="avatars.js"></script>
    <script src="cast.js"></script>
    <script src="kit.js"></script>
    <script src="icons.js"></script>
    <script>
      const { tl, el, who, react, kin, C } = K;
      el(K.cam, { left: 0, top: 70, width: 1080, textAlign: "center", font: "800 54px Manrope", color: C.text }, "Cast &amp; reactions");
      el(K.cam, { left: 0, top: 140, width: 1080, textAlign: "center", font: "600 30px Manrope", color: C.mute }, "Notionists × FloStocks · how each character acts");
      const cells = [
        ["ahmed", "Ahmed · JOY", "zabardast chai, 1 lakh", "joy"], ["ahmed", "Ahmed · SHOCK", "paisay nahi / doob raha", "shock"], ["ahmed", "Ahmed · THINK", "5 dhaabe ka sapna", "think"],
        ["aap", "Aap · LOVE", "\"chai toh kamaal hai!\"", "love"], ["aap", "Aap · WOW", "500 → 1,000", "wow"], ["sana", "Sana · UMEED", "hope", "think"],
        ["ayesha", "Ayesha · DARR", "panic sell", "worry"], ["bilal", "Bilal · BHAROSA", "confidence", "joy"], ["usman", "Usman · BUY", "demand rush", "buy"],
      ];
      cells.forEach(([n, title, sub, kind], i) => {
        const x = 20 + (i % 3) * 350, y = 230 + Math.floor(i / 3) * 560;
        const card = el(K.cam, { left: x, top: y, width: 340, height: 540, background: "#fff", borderRadius: 30, border: "3px solid #E3E9E5", boxShadow: "0 18px 40px rgba(20,40,20,.10)" });
        const w = who(card, n, 20, 50, 300, { expr: "smile", gesture: kind === "buy" ? "pointLongArm" : "none" });
        el(card, { left: 0, top: 400, width: 340, textAlign: "center", font: "800 30px Manrope", color: C.text }, title);
        el(card, { left: 0, top: 446, width: 340, textAlign: "center", font: "600 22px Manrope", color: C.gt }, sub);
        CAST.blinks(tl, w.av, 0, 6, "smile", i + 1);
        [0.6, 3.4].forEach((t) => {
          const tt = t + (i % 3) * 0.12;
          if (kind === "joy") react.joy(w, tt, { gesture: "waveLongArm" });
          if (kind === "shock") react.shock(w, tt, { flashColor: null });
          if (kind === "think") react.think(w, tt, 1.6);
          if (kind === "love") react.love(w, tt);
          if (kind === "wow") { react.shock(w, tt, { face: "wow" }); react.joy(w, tt + 0.6, { gesture: "waveOkLongArms" }); }
          if (kind === "worry") react.worry(w, tt, 2.0);
          if (kind === "buy") { const tg = el(w, { left: 170, top: 10, background: C.g, color: C.ink }, "BUY", "tag"); tl.fromTo(tg, { scale: 0 }, { scale: 1, rotation: 8, duration: 0.3, ease: "back.out(3)" }, tt).to(tg, { scale: 0, duration: 0.2 }, tt + 2.2); react.joy(w, tt + 0.1, { face: "happy" }); }
          tl.to(w.av, { y: 0, rotation: 0, scale: 1, duration: 0.3 }, tt + 2.4);
          CAST.expr(tl, w.av, "smile", tt + 2.4); CAST.gesture(tl, w.av, kind === "buy" ? "pointLongArm" : "none", tt + 2.4);
        });
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
