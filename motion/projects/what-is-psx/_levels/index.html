<!doctype html><html lang="en" data-resolution="portrait"><head><meta charset="UTF-8"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>@font-face{font-family:"Manrope";font-weight:200 800;src:url("assets/brand/fonts/Manrope-Variable.ttf");}
*{margin:0;padding:0}html,body{width:1080px;height:1920px;background:#F3F8EF;overflow:hidden}#root{position:relative;width:100%;height:100%;font-family:Manrope}
h1{position:absolute;left:0;right:0;top:50px;text-align:center;font-size:46px;font-weight:800;color:#0B0F14}
.row{position:absolute;left:20px;right:20px;height:560px;background:#fff;border-radius:28px}
.t{position:absolute;left:30px;top:22px;font-size:34px;font-weight:800;color:#0B0F14}.t span{font-size:22px;font-weight:600;color:#1F7A00;margin-left:12px}
.w{position:absolute;top:80px;width:250px;height:250px}.w svg{width:100%;height:100%}
.w2{position:absolute;top:330px;width:220px;height:220px}.w2 svg{width:100%;height:100%}</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<div id="c" class="clip" data-start="0" data-duration="1" data-track-index="0" style="position:absolute;inset:0"><h1>How much FloStocks green?</h1></div></div>
<script src="av_more.js"></script><script src="av_mid.js"></script><script src="av_less.js"></script><script src="cast.js"></script><script>
const rows=[["more","A · More green","every top green or pale green"],["mid","B · Balanced","Ahmed, Guide in green; some pale green"],["less","C · Accents only","white clothes; green cap + hijab only"]];
const c=document.getElementById("c");
rows.forEach(([lv,t,s],r)=>{const row=document.createElement("div");row.className="row";row.style.top=(140+r*590)+"px";row.innerHTML=`<div class="t">${t}<span>${s}</span></div>`;c.appendChild(row);
 window.AVDATA=window["AV_"+lv];
 ["ahmed","aap","guide","sana"].forEach((n,i)=>{const d=document.createElement("div");d.className="w";d.style.left=(10+i*255)+"px";row.appendChild(d);CAST.mount(d,n,{});});
 ["bilal","ayesha","usman","zara"].forEach((n,i)=>{const d=document.createElement("div");d.className="w2";d.style.left=(30+i*255)+"px";row.appendChild(d);CAST.mount(d,n,{});});});
const tl=gsap.timeline({paused:true});window.__timelines["main"]=tl;</script></body></html>
