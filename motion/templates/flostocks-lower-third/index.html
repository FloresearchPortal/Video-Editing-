<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Your Name"},
    {"id":"role","type":"string","label":"Role","default":"Floret Capitals"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; font-weight: 200 800; src: url("assets/brand/fonts/Manrope-Variable.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/brand/fonts/Inter-Variable.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; }
      /* Above the Reels UI (bottom ~20%) and left of the right-hand button column. */
      #strap { position: absolute; left: 64px; top: 1230px; width: 840px; height: 230px; }
      #plate { position: absolute; left: 70px; top: 0; width: 760px; height: 210px; border-radius: 30px;
               background: rgba(11, 15, 20, 0.84); border: 2px solid rgba(56, 209, 0, 0.25); transform-origin: 0% 50%; }
      /* the logo's mark: two green slanted bars + one white */
      .bar { position: absolute; width: 26px; border-radius: 7px; }
      #m1 { left: 8px; top: 64px; height: 120px; background: #38D100; }
      #m2 { left: 30px; top: 104px; height: 96px; background: #2AA300; }
      #m3 { left: 44px; top: 18px; height: 70px; background: #fff; }
      .mask { position: absolute; left: 118px; overflow: hidden; width: 690px; }
      #name-mask { top: 30px; height: 96px; }
      #role-mask { top: 124px; height: 56px; }
      #name { display: block; font: 800 66px/96px "Manrope", sans-serif; color: #fff; letter-spacing: -0.015em; white-space: nowrap; }
      #role { display: block; font: 500 36px/56px "Inter", sans-serif; color: #38D100; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="strap" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="plate" data-layout-allow-occlusion></div>
        <div id="m1" class="bar"></div>
        <div id="m2" class="bar"></div>
        <div id="m3" class="bar"></div>
        <div id="name-mask" class="mask" data-layout-allow-overflow><span id="name" data-var-text="name" data-layout-allow-occlusion>Your Name</span></div>
        <div id="role-mask" class="mask" data-layout-allow-overflow><span id="role" data-var-text="role" data-layout-allow-occlusion>Floret Capitals</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".bar", { yPercent: 140, opacity: 0, skewX: -20 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "expo.out", stagger: 0.05 }, 0)
        .fromTo("#plate", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.12)
        .fromTo("#name", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.25)
        .fromTo("#role", { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 0.38)
        .to(["#role", "#name"], { yPercent: 110, duration: 0.3, ease: "power2.in", stagger: 0.04 }, 3.8)
        .to("#plate", { scaleX: 0, duration: 0.35, ease: "power2.in" }, 3.95)
        .to(".bar", { yPercent: -140, opacity: 0, duration: 0.3, ease: "power2.in", stagger: 0.04 }, 4.05);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
