<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Headline","default":"Learn the PSX, free."},
    {"id":"line","type":"string","label":"Supporting line","default":"6 video lessons · PSX Analyzer · calculators"},
    {"id":"url","type":"string","label":"URL","default":"flostocks.com"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; font-weight: 200 800; src: url("assets/brand/fonts/Manrope-Variable.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/brand/fonts/Inter-Variable.ttf"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("assets/brand/fonts/IBMPlexMono-SemiBold.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0F14; }
      #root { position: relative; width: 100%; height: 100%; }
      #bgfill { position: absolute; inset: 0; background: radial-gradient(110% 60% at 50% 40%, #12301a 0%, #0B0F14 65%); }
      .deco { position: absolute; width: 90px; height: 900px; border-radius: 24px; opacity: 0.16; }
      #d1 { left: -10px; top: 1250px; background: #38D100; }
      #d2 { left: 110px; top: 1380px; background: #2AA300; }
      #d3 { left: 900px; top: -300px; background: #38D100; }
      #logo { position: absolute; left: 140px; width: 800px; top: 520px; height: 266px; object-fit: contain; }
      #head { position: absolute; left: 70px; right: 70px; top: 860px; height: 200px; text-align: center;
              font: 800 88px/100px "Manrope", sans-serif; color: #fff; letter-spacing: -0.02em; }
      #line { position: absolute; left: 90px; right: 90px; top: 1080px; height: 60px; text-align: center;
              font: 500 36px/60px "Inter", sans-serif; color: rgba(234, 249, 228, 0.75); white-space: nowrap; }
      #pill { position: absolute; left: 240px; width: 600px; top: 1200px; height: 110px; border-radius: 55px; background: #38D100; }
      #url { position: absolute; left: 0; right: 0; top: 0; height: 110px; text-align: center; font: 600 46px/110px "IBM Plex Mono", monospace; color: #062600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="bg-clip" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="bgfill"></div>
        <div id="d1" class="deco"></div><div id="d2" class="deco"></div><div id="d3" class="deco"></div>
      </div>
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <img id="logo" src="assets/logos/flostocks-logo-full-on-dark.png" alt="FloStocks" />
        <div id="head" data-var-text="headline">Learn the PSX, free.</div>
        <div id="line" data-var-text="line">6 video lessons · PSX Analyzer · calculators</div>
        <div id="pill"><div id="url" data-var-text="url">flostocks.com</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set(".deco", { skewX: -20 }, 0)
        .fromTo(".deco", { yPercent: 40 }, { yPercent: -10, duration: 4, ease: "none" }, 0)
        .fromTo("#logo", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.05)
        .fromTo("#head", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.25)
        .fromTo("#line", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.4)
        .fromTo("#pill", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, 0.6)
        .fromTo("#pill", { scale: 1 }, { scale: 1.05, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 1.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
