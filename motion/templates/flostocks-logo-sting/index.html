<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"tagline","type":"string","label":"Line under the logo","default":"learn the PSX. free."},
    {"id":"bg","type":"enum","label":"Background","default":"night","options":[{"value":"night","label":"Dark card"},{"value":"none","label":"Transparent"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/brand/fonts/Inter-Variable.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Inter", sans-serif; }
      #bgfill { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 45%, #10241a 0%, #0B0F14 62%); }
      /* The mark's three slanted bars, drawn big, sweep through and settle into the logo. */
      .bar { position: absolute; width: 150px; height: 520px; border-radius: 26px; transform-origin: 50% 50%; }
      #b1 { left: 300px; top: 560px; background: #38D100; }
      #b2 { left: 470px; top: 700px; background: #2AA300; }
      #b3 { left: 640px; top: 520px; background: #ffffff; }
      #logo { position: absolute; left: 90px; width: 900px; top: 760px; height: 300px; object-fit: contain; }
      #glint { position: absolute; left: 90px; width: 900px; top: 760px; height: 300px; overflow: hidden;
               -webkit-mask: url("assets/logos/flostocks-logo-full-on-dark.png") center / contain no-repeat;
               mask: url("assets/logos/flostocks-logo-full-on-dark.png") center / contain no-repeat; }
      #glint i { position: absolute; top: -40%; left: 0; width: 120px; height: 180%;
                 background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.55), rgba(255,255,255,0)); }
      #tag { position: absolute; left: 0; right: 0; top: 1090px; height: 70px; text-align: center; font-weight: 500;
             font-size: 46px; line-height: 70px; color: #EAF9E4; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="bg-clip" class="clip" data-start="0" data-duration="3" data-track-index="0"><div id="bgfill"></div></div>
      <div id="sting" class="clip" data-start="0" data-duration="3" data-track-index="1" data-layout-allow-overflow>
        <div id="b1" class="bar"></div>
        <div id="b2" class="bar"></div>
        <div id="b3" class="bar"></div>
        <img id="logo" src="assets/logos/flostocks-logo-full-on-dark.png" alt="FloStocks" />
        <div id="glint" data-layout-allow-occlusion><i></i></div>
        <div id="tag" data-var-text="tagline">learn the PSX. free.</div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      if (v.bg === "none") document.getElementById("bgfill").style.display = "none";
      const tl = gsap.timeline({ paused: true });
      // bars shoot up from below, staggered, leaning like the mark; then sweep off as the logo lands
      tl.fromTo(".bar", { yPercent: 160, skewX: -20, opacity: 1 }, { yPercent: 0, duration: 0.45, ease: "expo.out", stagger: 0.07 }, 0)
        .to(".bar", { yPercent: -260, opacity: 0, duration: 0.4, ease: "power3.in", stagger: 0.05 }, 0.6)
        .fromTo("#logo", { scale: 0.86, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.85)
        .fromTo("#glint i", { xPercent: -150, skewX: -20 }, { xPercent: 900, duration: 0.7, ease: "power2.inOut" }, 1.2)
        .fromTo("#tag", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.25)
        .to("#logo", { scale: 1.03, duration: 1.4, ease: "none" }, 1.35)
        .to(["#logo", "#tag"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.72);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
