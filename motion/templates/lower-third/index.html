<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Your Name"},
    {"id":"role","type":"string","label":"Role","default":"what you do"},
    {"id":"accent","type":"color","label":"Accent","default":"#F07A5A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/Poppins-Bold.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 300; src: url("assets/fonts/Poppins-Light.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Poppins", sans-serif; }
      /* Reels/TikTok UI covers the bottom ~20% and a right-hand column: sit above and left of it. */
      #strap { position: absolute; left: 72px; top: 1236px; width: 820px; height: 220px; }
      #bar { position: absolute; left: 0; top: 18px; width: 12px; height: 168px; border-radius: 6px; background: var(--accent); transform-origin: 50% 0%; }
      #plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 28px;
               background: linear-gradient(90deg, rgba(10, 12, 20, 0.62), rgba(10, 12, 20, 0)); transform-origin: 0% 50%; }
      .mask { position: absolute; left: 44px; overflow: hidden; width: 760px; }
      #name-mask { top: 22px; height: 96px; }
      #role-mask { top: 122px; height: 60px; }
      #name { display: block; font-weight: 700; font-size: 72px; line-height: 96px; color: #fff; letter-spacing: -0.01em; white-space: nowrap; }
      #role { display: block; font-weight: 300; font-size: 40px; line-height: 60px; color: rgba(255, 255, 255, 0.86); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="strap" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div id="plate" data-layout-allow-occlusion></div>
        <div id="bar"></div>
        <div id="name-mask" class="mask" data-layout-allow-overflow><span id="name" data-var-text="name" data-layout-allow-occlusion>Your Name</span></div>
        <div id="role-mask" class="mask" data-layout-allow-overflow><span id="role" data-var-text="role">what you do</span></div>
      </div>
    </div>
    <script>
      // In 0-0.7 s, hold, out 3.8-4.4 s. Ease out on entry, ease in on exit; nothing bounces.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#plate", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0)
        .fromTo("#bar", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.05)
        .fromTo("#name", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 0.15)
        .fromTo("#role", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.3)
        .to("#role", { yPercent: 110, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.8)
        .to("#name", { yPercent: 105, duration: 0.35, ease: "power2.in" }, 3.85)
        .to("#bar", { scaleY: 0, duration: 0.3, ease: "power2.in" }, 4.0)
        .to("#plate", { scaleX: 0, opacity: 0, duration: 0.35, ease: "power2.in" }, 4.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
